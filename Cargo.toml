[package]
name = "honeypot"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
sqlx = {
    version = "0.9.0",
    features = [
        "runtime-tokio",
        "postgres",
        "migrate",
        "chrono"
    ]
}
dotenvy = "0.15"
urlencoding = "2.1.3"
chrono = "0.4.45"
jsonwebtoken = "9"
bcrypt = "0.19.3"
